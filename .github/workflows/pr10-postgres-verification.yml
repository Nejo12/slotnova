name: pr10-postgres-verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    name: real PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Real PostgreSQL integration tests
        run: pnpm test:integration
