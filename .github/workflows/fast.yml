# Fast lane — runs on every PR and on pushes to main.
# Target: under 3 minutes on a warm Turborepo cache (see docs/standards/ci-quality-gates.md).
# Heavy lane (real PostgreSQL, migrations, Playwright, a11y, security scans) is a
# separate required workflow added in a later PR.
#
# Merge policy: this workflow is a REQUIRED status check. Auto-merge is disabled
# at the repository level; the founder performs the final merge.
name: fast

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  # Optional remote cache — set repo/org secret TURBO_TOKEN and variable TURBO_TEAM to enable.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  fast:
    name: format · lint · boundaries · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # T066: the breaking-change check below needs the merge-base commit
          # with the PR's target branch to read the OpenAPI document as it
          # existed before this branch's changes (`git merge-base` / `git
          # show`) -- the default shallow (depth-1) checkout has no such
          # history. `fetch-depth: 0` is the standard fix; this job is the
          # fast lane's only checkout and stays well under its 3-minute
          # budget with a full fetch on this repo's current size.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Stylelint / token rules
        run: pnpm lint:styles

      - name: Architecture boundaries
        run: pnpm lint:boundaries

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit / property tests
        run: pnpm test

      - name: Build / type-generation smoke
        run: pnpm build

      # T066 (specs/001-platform-foundation-shell/tasks.md, FR-036, FR-038,
      # SC-008; docs/decisions/0004-validation-contract-integration.md). Runs
      # after `pnpm build` -- `contracts:check` regenerates
      # `apps/api/openapi/openapi.json` via the API's compiled
      # `openapi:generate` script, which requires `dist/` to exist.
      - name: Contract drift check
        run: pnpm contracts:check

      # Non-blocking by design -- see the reasoning comment at the top of
      # tooling/contracts/check-breaking-changes.ts. Runs after the drift
      # check so a breaking-change report is only ever compared against a
      # document already proven (above) to match current source.
      - name: OpenAPI breaking-change check
        run: pnpm contracts:check:breaking
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
