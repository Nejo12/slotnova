# T087 complete: migration proof (T074 foundation) + targeted visual
# regression (T088) + accessibility checks (axe, via the existing shell-a11y
# Playwright spec). Real-PostgreSQL integration and Playwright journeys 6/7
# remain in the separate required e2e.yml workflow; security scans remain in
# the separate required security.yml workflow -- composed as distinct
# required checks rather than duplicated here. Never deploys the application.
name: heavy
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        required: true
      release_sha:
        description: Exact reviewed main commit to migrate
        type: string
        required: true
permissions:
  contents: read
env:
  SLOTNOVA_ENV: preview
jobs:
  migration-checklist:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx tooling/migrations/check-pr-checklist.ts
  migration-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Explicit CLI clean and populated forward migration proof
        run: pnpm --filter @slotnova/db test:integration
      - name: Separate scheduler release and runtime role proof
        run: pnpm --filter @slotnova/worker exec vitest run --config vitest.integration.config.ts src/scheduler/__tests__/release.int.test.ts
  visual-regression:
    name: targeted visual regression (Storybook, Light/Dark)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slotnova/ui build-storybook
      - run: pnpm --filter @slotnova/ui exec playwright install --with-deps chromium
      - name: Targeted Storybook visual regression (Light + Dark)
        run: pnpm --filter @slotnova/ui test:visual
  accessibility:
    name: axe accessibility checks (Playwright journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @slotnova/web exec playwright install --with-deps chromium
      - name: Playwright journeys, including the shell-a11y axe spec (T062)
        run: pnpm e2e
  security-scan-reference:
    name: security scans (see security.yml)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Security scanning runs in the separate required security.yml workflow
        run: |
          echo "Dependency vulnerability, secret, and static-analysis scanning" \
               "run in the separate required 'security' workflow (security.yml)," \
               "not duplicated here, per T087's 'do not duplicate work" \
               "gratuitously' acceptance criterion."
  budget-check:
    # T089: runs only after every other ordinary heavy-lane job has finished
    # (release-migrations is founder-dispatch-only and excluded -- it is not
    # part of the ordinary pre-merge lane this budget governs), so this job's
    # own start time is a faithful proxy for "the heavy lane finished".
    # Measures the actual workflow wall-clock duration via the GitHub Actions
    # API's run_started_at for this run -- never a hard-coded number, never a
    # single job's own duration standing in for the workflow's total. See
    # tooling/perf/check-heavy-budget.ts and
    # docs/standards/ci-quality-gates.md's "Heavy-lane pre-merge time budget".
    name: heavy-lane time budget check (180s, T089)
    if: always()
    needs:
      [
        migration-checklist,
        migration-proof,
        visual-regression,
        accessibility,
        security-scan-reference,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check heavy-lane wall-clock duration against the founder-approved 180s budget
        run: pnpm exec tsx tooling/perf/check-heavy-budget.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  release-migrations:
    # Deliberately disabled until a private runner, secrets and release controls exist.
    # Dispatch is Founder-only, from reviewed main, bound to its exact SHA.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      inputs.release_sha == github.sha &&
      vars.MIGRATION_RELEASE_ENABLED == 'true'
    needs: migration-proof
    runs-on: [self-hosted, linux, slotnova-release]
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    concurrency:
      group: database-release-${{ inputs.target }}
      cancel-in-progress: false
    env:
      SLOTNOVA_ENV: ${{ inputs.target }}
      DATABASE_CONNECTION_MODE: direct
      DATABASE_SSL: require
      SCHEDULER_OWNER_ROLE: slotnova_scheduler_owner
      NODE_EXTRA_CA_CERTS: ${{ vars.DATABASE_CA_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slotnova/worker... build
      - name: Reviewed business migrations (not application startup)
        run: pnpm --filter @slotnova/db db:migrate
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
      - name: Pinned scheduler schema initialization or upgrade
        run: pnpm --filter @slotnova/worker db:migrate:scheduler
        env:
          SCHEDULER_MIGRATION_URL: ${{ secrets.SCHEDULER_MIGRATION_URL }}
      - name: Release gate evidence
        run: echo 'Migration steps succeeded. Application deployment remains a separate release action.'
