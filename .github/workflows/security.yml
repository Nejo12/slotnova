name: security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail on high or critical dependency advisories
        run: pnpm audit --audit-level high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned credential-free scanners
        run: |
          python -m pip install semgrep==1.177.0
          bash tooling/security/install-gitleaks.sh "$RUNNER_TEMP/security-bin"
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"
      - name: Prove scanner detection is active
        run: bash tooling/security/scanner-canaries.sh
      - name: Scan committed history for secrets
        run: gitleaks git --redact --no-banner
      - name: Static security analysis
        run: semgrep scan --config tooling/security/semgrep.yml --error --strict --metrics=off --disable-version-check apps packages tooling
